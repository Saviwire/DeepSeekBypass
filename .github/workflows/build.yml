name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2.0' # Pin to a compatible version

    - name: Build the App (No Code Signing)
      run: |
        # Use the correct scheme name for PakePlus
        xcodebuild clean build \
          -project PakePlus.xcodeproj \
          -scheme PakePlus \
          -sdk iphoneos \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CONFIGURATION_BUILD_DIR=$(pwd)/build

    - name: Create IPA
      run: |
        mkdir Payload
        APP_PATH=$(find build -name "*.app" | head -n 1)
        cp -r "$APP_PATH" Payload/
        zip -r DeepSeekBypass.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeepSeekBypass-IPA
        path: DeepSeekBypass.ipa
